# Applies to every draft in /drafts: the same as /posts, plus what keeps a draft private.
# Drafts are published at /drafts/<name>/ for review, listed only on /drafts/, and kept out of
# the home page, the archive, the RSS feed, search, the sitemap and search engines (noindex).
# Promote a draft with .claude/skills/new-post/promote-draft.sh (see the new-post skill).
author: "Stéphane Cuenat"
title-block-banner: false
freeze: true
license: "CC BY"
search: false          # not in the site search
draft-preview: true    # draft-banner.lua: "Draft" banner and noindex
