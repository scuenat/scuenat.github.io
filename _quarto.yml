project:
  type: website
  output-dir: _site

website:
  title: "Stéphane Cuenat"
  description: "AI, honestly: where AI meets machines, measurement and the limits of intelligence."
  site-url: https://scuenat.github.io
  repo-url: https://github.com/scuenat/scuenat.github.io
  open-graph: true
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Essays
      - href: papers/index.qmd
        text: Papers
      - href: about.qmd
        text: About
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/st%C3%A9phane-cuenat-87116b5/
      - icon: github
        href: https://github.com/scuenat
      - icon: rss
        href: index.xml
  page-footer:
    left: "© 2026 Stéphane Cuenat"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles.scss]
    toc: true
    html-math-method: katex
    code-copy: true
    smooth-scroll: true

execute:
  freeze: auto
