project:
  type: website
  output-dir: _site
  resources:
    - hero-network.svg   # only referenced from CSS

website:
  title: "AI, Honestly"
  description: "Ideas about AI, without the hype. Essays on where AI is heading, and working papers that put ideas to the test."
  site-url: https://scuenat.github.io
  favicon: favicon.png
  image: social-card.jpg
  open-graph: true
  twitter-card: true
  search: true
  draft-mode: gone
  navbar:
    title: "AI, Honestly"
    logo: favicon.png
    left:
      - href: index.qmd
        text: Essays
      - href: about.qmd
        text: About
      - href: https://www.linkedin.com/newsletters/ai-honestly-7484605558868844544
        text: Newsletter
    right:
      - href: fr/index.qmd
        text: FR
      - icon: rss
        href: index.xml
        aria-label: RSS feed
      - icon: linkedin
        text: Follow
        href: https://www.linkedin.com/in/st%C3%A9phane-cuenat-87116b5/
        aria-label: Follow on LinkedIn
  page-footer:
    left: "© 2026 AI, Honestly · Porrentruy, Swiss Jura · [CC BY 4.0](/about.html#reuse)"

lang: en

format:
  html:
    theme:
      light: [cosmo, light.scss, styles.scss]
      dark: [darkly, dark.scss, styles.scss]
    toc: true
    toc-location: right
    html-math-method: katex
    code-copy: true
    smooth-scroll: true
    fig-align: center
    fig-cap-location: bottom
    link-external-newwindow: true
    filters:
      - lang-links.lua
    include-after-body:
      text: |
        <script>
        // Language switch: point FR/EN at this page's translation (see lang-links.lua),
        // and on French pages translate the shared navbar labels.
        (function () {
          var fr = location.pathname.indexOf("/fr/") === 0;
          var alt = document.querySelector('meta[name="alt-lang-url"]');
          document.querySelectorAll(".navbar .nav-link").forEach(function (sw) {
            var t = sw.querySelector(".menu-text");
            if (!t || t.textContent.trim() !== "FR") return;
            sw.href = alt ? alt.content : (fr ? "/" : "/fr/");
            t.textContent = fr ? "EN" : "FR";
            sw.setAttribute("lang", fr ? "en" : "fr");
            sw.setAttribute("aria-label", fr ? "Read in English" : "Lire en français");
          });
          if (!fr) return;
          var labels = { "Essays": ["Essais", "/fr/"], "About": ["À propos", "/fr/about.html"], "Follow": ["Suivre"] };
          document.querySelectorAll(".navbar .nav-link").forEach(function (a) {
            var t = a.querySelector(".menu-text"), m = t && labels[t.textContent.trim()];
            if (!m) return;
            t.textContent = m[0];
            if (m[1]) {
              a.href = m[1];
              var here = location.pathname.replace(/index\.html$/, "");
              a.classList.toggle("active", here === m[1]);
            }
          });
          document.querySelectorAll(".navbar-brand").forEach(function (a) { a.href = "/fr/"; });
          document.querySelectorAll('.nav-footer a[href$="about.html#reuse"]').forEach(function (a) { a.href = "/fr/about.html#reuse"; });
        })();
        </script>
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
        <script data-goatcounter="https://scuenat.goatcounter.com/count"
                async src="https://gc.zgo.at/count.js"></script>

execute:
  freeze: auto
