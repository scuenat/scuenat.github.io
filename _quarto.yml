project:
  type: website
  output-dir: _site
  resources:
    - hero-network.svg   # only referenced from CSS

website:
  title: "Stéphane Cuenat"
  description: "AI, honestly: where AI meets machines, measurement and the limits of intelligence."
  site-url: https://scuenat.github.io
  favicon: favicon.png
  image: profile.png
  open-graph: true
  twitter-card: true
  search: true
  draft-mode: gone
  navbar:
    title: "Stéphane Cuenat"
    logo: favicon.png
    left:
      - href: index.qmd
        text: Essays
      - href: papers/index.qmd
        text: Papers
      - href: about.qmd
        text: About
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/st%C3%A9phane-cuenat-87116b5/
        aria-label: LinkedIn
      - icon: rss
        href: index.xml
        aria-label: RSS feed
  page-footer:
    left: "© 2026 Stéphane Cuenat · Porrentruy, Swiss Jura"
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/st%C3%A9phane-cuenat-87116b5/
        aria-label: LinkedIn

format:
  html:
    theme:
      light: [cosmo, light.scss, styles.scss]
      dark: [darkly, dark.scss, styles.scss]
    toc: true
    toc-location: right
    html-math-method: katex
    code-copy: true
    smooth-scroll: true
    fig-align: center
    fig-cap-location: bottom
    link-external-newwindow: true

execute:
  freeze: auto
