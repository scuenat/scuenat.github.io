project:
  type: website
  output-dir: _site
  resources:
    - hero-network.svg   # only referenced from CSS

website:
  title: "AI, Honestly"
  description: "Ideas about AI, without the hype. Essays on where AI is heading, and working papers that put ideas to the test."
  site-url: https://scuenat.github.io
  favicon: favicon.png
  image: social-card.jpg
  open-graph: true
  twitter-card: true
  search: true
  draft-mode: gone
  navbar:
    title: "AI, Honestly"
    logo: favicon.png
    left:
      - href: index.qmd
        text: Essays
      - href: about.qmd
        text: About
      - href: https://www.linkedin.com/newsletters/ai-honestly-7484605558868844544
        text: Newsletter
    right:
      - icon: rss
        href: index.xml
        aria-label: RSS feed
      - icon: linkedin
        text: Follow
        href: https://www.linkedin.com/in/st%C3%A9phane-cuenat-87116b5/
        aria-label: Follow on LinkedIn
  page-footer:
    left: "© 2026 AI, Honestly · Porrentruy, Swiss Jura"

lang: en

format:
  html:
    theme:
      light: [cosmo, light.scss, styles.scss]
      dark: [darkly, dark.scss, styles.scss]
    toc: true
    toc-location: right
    html-math-method: katex
    code-copy: true
    smooth-scroll: true
    fig-align: center
    fig-cap-location: bottom
    link-external-newwindow: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
        <script data-goatcounter="https://scuenat.goatcounter.com/count"
                async src="https://gc.zgo.at/count.js"></script>

execute:
  freeze: auto
