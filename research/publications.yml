- title: "Utilisation de l'apprentissage profond et d'un microscope holographique pour la localisation d'objets avec une précision sub-micrométrique"
  title_en: "Using deep learning and a holographic microscope to locate objects with sub-micrometer accuracy"
  authors: "Stéphane Cuenat"
  venue: "PhD thesis in computer science, FEMTO-ST and Université Marie et Louis Pasteur"
  year: 2025
  kind: thesis
  note: "The thesis that ties the papers below together: deep networks that read position straight from a hologram, fast enough to run on a CPU."
  note_fr: "La thèse qui relie les articles ci-dessous : des réseaux profonds qui lisent la position directement dans un hologramme, assez vite pour tourner sur un CPU."

- title: "Video-rate 3D pose measurement with sub-micrometer accuracy using deep learning and digital holography for robotic applications"
  authors: "Stéphane Cuenat et al."
  venue: "euspen 25th International Conference & Exhibition, Zaragoza"
  year: 2025
  kind: conference
  featured: true
  note: "A tiny network (TinyGedanken) finds the in-focus distance in about a millisecond, fast enough to follow a moving micro-robot at video rate."
  note_fr: "Un tout petit réseau (TinyGedanken) trouve la distance de mise au point en une milliseconde environ, assez vite pour suivre un micro-robot en mouvement à la cadence vidéo."
  links:
    - label: "PDF"
      url: "https://www.euspen.eu/knowledge-base/ICE25158.pdf"

- title: "Digital holographic microscopy applied to 3D computer micro-vision by using deep neural networks"
  authors: "Stéphane Cuenat, Jesús E. Brito Carcaño, Belal Ahmad, Patrick Sandoz, Raphaël Couturier, Guillaume J. Laurent, Maxime Jacquot"
  venue: "Journal of the European Optical Society – Rapid Publications 20, 2024032"
  year: 2024
  kind: journal
  featured: true
  doi: "10.1051/jeos/2024032"
  note: "An adapted GedankenNet and a UNet-like model, trained on simulated holograms, infer the 3D pose of micro-objects; open access."
  note_fr: "Un GedankenNet adapté et un modèle de type UNet, entraînés sur des hologrammes simulés, déduisent la pose 3D de micro-objets ; en accès libre."

