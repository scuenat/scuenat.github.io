  venue: "Optics Express 30(14), 24730–24746"
  year: 2022
  kind: journal
  featured: true
  note: "Tiny networks give the focus distance to 1.2 µm on average, against a 15 µm depth of field, in under 25 ms on a CPU."
  note_fr: "De tout petits réseaux donnent la distance de mise au point à 1,2 µm en moyenne, pour une profondeur de champ de 15 µm, en moins de 25 ms sur un CPU."
  links:
    - label: "arXiv"
      url: "https://arxiv.org/abs/2203.07772"

